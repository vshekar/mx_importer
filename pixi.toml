[workspace]
authors = ["vshekar1 <vshekar1@bnl.gov>"]
channels = ["conda-forge"]
name = "mx_importer"
platforms = ["linux-64"]
version = "0.1.0"

[tasks.start]
cmd = "cd \"$INIT_CWD\" && python \"$PIXI_PROJECT_ROOT/start_importer.py\" \"$CONFIG_FILE\""

[dependencies]
python = ">=3.13.5,<3.14"
qtpy = ">=2.4.3,<3"
requests = ">=2.32.4,<3"
amostra = "==0.2.4"
conftrak = ">=0.0.9,<0.0.10"
analysisstore = ">=0.0.6,<0.0.7"
pyqt = ">=5.15.11,<6"
ipython = ">=9.7.0,<10"
ophyd = ">=1.11.0,<2"
pandas = ">=3.1.0,<4"
openpyxl = ">=3.1.5,<4"
xlrd = ">=2.0.2,<3"
